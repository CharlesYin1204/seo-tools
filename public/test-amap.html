<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMap Test</title>
<style>
body { margin: 0; font-family: Arial, sans-serif; }
#info { padding: 10px; background: #f5f5f5; font-size: 13px; }
#info p { margin: 4px 0; }
.ok { color: green; } .err { color: red; } .warn { color: orange; }
#map { width: 100%; height: calc(100vh - 200px); min-height: 400px; }
#log { padding: 10px; background: #222; color: #0f0; font-size: 12px; font-family: monospace;
  max-height: 150px; overflow-y: auto; }
</style>
</head>
<body>
<div id="info">
  <p><b>AMap Direct Test</b> (No Vue, No Framework)</p>
  <p id="step1">1. Loading AMap SDK...</p>
  <p id="step2">2. Creating map...</p>
  <p id="step3">3. Adding marker...</p>
</div>
<div id="map"></div>
<div id="log"></div>

<script>
function log(msg, cls) {
  var d = document.getElementById('log');
  var p = document.createElement('div');
  p.className = cls || '';
  p.textContent = new Date().toLocaleTimeString() + ' ' + msg;
  d.appendChild(p);
  d.scrollTop = d.scrollHeight;
  console.log(msg);
}

function setStep(id, msg, cls) {
  var el = document.getElementById(id);
  el.textContent = el.textContent.split('.')[0] + '. ' + msg;
  el.className = cls;
}

window.onerror = function(msg, src, line) {
  log('GLOBAL ERROR: ' + msg + ' at ' + src + ':' + line, 'err');
};

log('Starting AMap test...');
log('Fetching map config from /map-search API...');

fetch('/map-search', { headers: { 'Accept': 'application/json' } })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    var d = data.data || data;
    var cfg = d.map_config;
    log('API response received. Properties: ' + (d.properties ? d.properties.length : 0));
    log('Map config: enabled=' + cfg.enabled + ', key=' + (cfg.js_api_key ? cfg.js_api_key.substring(0,8) + '...' : 'NONE'));
    log('Security key: ' + (cfg.security_js_key ? cfg.security_js_key.substring(0,8) + '...' : 'NONE'));

    if (!cfg.js_api_key) {
      setStep('step1', 'FAILED - No API key', 'err');
      return;
    }

    if (cfg.security_js_key) {
      window._AMapSecurityConfig = { securityJsCode: cfg.security_js_key };
      log('Set _AMapSecurityConfig');
    }

    var s = document.createElement('script');
    s.src = 'https://webapi.amap.com/maps?v=1.4.15&key=' + cfg.js_api_key + '&plugin=AMap.InfoWindow&lang=en';
    s.onload = function() {
      log('AMap SDK loaded. window.AMap=' + (typeof window.AMap));
      setStep('step1', 'AMap SDK loaded OK', 'ok');

      if (!window.AMap || !window.AMap.Map) {
        setStep('step2', 'FAILED - AMap.Map not found', 'err');
        log('ERROR: AMap.Map is not available', 'err');
        return;
      }

      try {
        var map = new AMap.Map('map', {
          center: [cfg.default_center_lng || 121.4737, cfg.default_center_lat || 31.2304],
          zoom: cfg.default_zoom || 12,
          resizeEnable: true,
          lang: 'en'
        });

        setStep('step2', 'Map created', 'ok');
        log('Map instance created');

        map.on('complete', function() {
          setStep('step2', 'Map tiles loaded (complete)', 'ok');
          log('Map complete event fired - tiles loaded!', 'ok');
        });

        map.on('error', function(e) {
          log('Map error event: ' + JSON.stringify(e), 'err');
        });

        setTimeout(function() {
          var marker = new AMap.Marker({
            position: [121.4737, 31.2304],
            title: 'Test Marker - Shanghai'
          });
          map.add(marker);
          setStep('step3', 'Marker added at Shanghai center', 'ok');
          log('Test marker added');
        }, 1000);

        setTimeout(function() {
          var container = document.getElementById('map');
          var layers = container.querySelectorAll('.amap-layer, .amap-maps, canvas, img[src*="amap"], img[src*="autonavi"]');
          log('Map container children: ' + container.children.length);
          log('Map layers/tiles found: ' + layers.length);
          if (layers.length === 0) {
            log('WARNING: No map layers found - tiles may not be loading!', 'warn');
            setStep('step2', 'Map created but NO TILES loaded!', 'warn');
          }
        }, 5000);

      } catch(e) {
        setStep('step2', 'FAILED - ' + e.message, 'err');
        log('Map creation error: ' + e.message, 'err');
      }
    };
    s.onerror = function(e) {
      setStep('step1', 'FAILED - SDK script error', 'err');
      log('AMap SDK failed to load: ' + JSON.stringify(e), 'err');
    };
    document.head.appendChild(s);
  })
  .catch(function(e) {
    log('API fetch error: ' + e.message, 'err');
    setStep('step1', 'FAILED - API error: ' + e.message, 'err');
  });
</script>
</body>
</html>
