<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地图测试页面 - Map Debug</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
    
    .container { max-width: 1400px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    
    h1 { color: #333; margin-bottom: 20px; font-size: 24px; }
    
    .debug-section { margin-bottom: 20px; padding: 15px; background: #f9f9f9; border-radius: 6px; border-left: 4px solid #667eea; }
    .debug-section h2 { font-size: 16px; color: #667eea; margin-bottom: 10px; }
    .debug-section pre { background: #2d2d2d; color: #f8f8f2; padding: 10px; border-radius: 4px; overflow-x: auto; font-size: 12px; line-height: 1.5; }
    
    .status { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; margin-left: 10px; }
    .status.success { background: #d4edda; color: #155724; }
    .status.error { background: #f8d7da; color: #721c24; }
    .status.warning { background: #fff3cd; color: #856404; }
    
    #amap-container { width: 100%; height: 500px; border: 2px solid #e0e0e0; border-radius: 8px; margin-top: 10px; }
    
    .loading { text-align: center; padding: 40px; color: #999; }
    .loading i { font-size: 32px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    button { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; margin-right: 10px; }
    button:hover { background: #5a6fd6; }
    button:disabled { background: #ccc; cursor: not-allowed; }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <h1><i class="fas fa-map-marked-alt"></i> 地图调试页面</h1>
    
    <div class="debug-section">
      <h2>1. API数据加载 <span id="api-status" class="status warning">等待测试</span></h2>
      <button onclick="testAPI()">测试API</button>
      <pre id="api-result">点击"测试API"按钮开始...</pre>
    </div>
    
    <div class="debug-section">
      <h2>2. 高德SDK加载 <span id="sdk-status" class="status warning">等待加载</span></h2>
      <button onclick="testSDK()">检查SDK</button>
      <pre id="sdk-result">点击"检查SDK"按钮...</pre>
    </div>
    
    <div class="debug-section">
      <h2>3. 地图初始化 <span id="map-status" class="status warning">未初始化</span></h2>
      <button onclick="initMap()" id="init-map-btn">初始化地图</button>
      <button onclick="clearConsole()">清空日志</button>
      <pre id="map-result">点击"初始化地图"按钮...</pre>
    </div>
    
    <div class="debug-section">
      <h2>4. 地图容器</h2>
      <div id="amap-container"></div>
    </div>
    
    <div class="debug-section">
      <h2>5. 控制台日志</h2>
      <pre id="console-log" style="max-height: 300px; overflow-y: auto;"></pre>
    </div>
  </div>

  <script>
    let mapData = null;
    let mapInstance = null;
    let logBuffer = [];

    // 捕获控制台输出
    const originalLog = console.log;
    const originalError = console.error;
    const originalWarn = console.warn;

    function addLog(type, ...args) {
      const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)).join(' ');
      const timestamp = new Date().toLocaleTimeString();
      logBuffer.push(`[${timestamp}] [${type}] ${msg}`);
      document.getElementById('console-log').textContent = logBuffer.slice(-50).join('\n');
      
      if (type === 'error') originalError(...args);
      else if (type === 'warn') originalWarn(...args);
      else originalLog(...args);
    }

    console.log = (...args) => addLog('log', ...args);
    console.error = (...args) => addLog('error', ...args);
    console.warn = (...args) => addLog('warn', ...args);

    function clearConsole() {
      logBuffer = [];
      document.getElementById('console-log').textContent = '日志已清空';
    }

    async function testAPI() {
      const resultEl = document.getElementById('api-result');
      const statusEl = document.getElementById('api-status');
      
      try {
        statusEl.textContent = '加载中...';
        statusEl.className = 'status warning';
        resultEl.textContent = '正在请求 /map-search...';
        
        console.log('开始请求 /map-search API...');
        const response = await fetch('/map-search', {
          headers: { 'Accept': 'application/json' }
        });
        
        console.log('API响应状态:', response.status);
        console.log('Content-Type:', response.headers.get('content-type'));
        
        const data = await response.json();
        mapData = data.data || data;
        
        const result = {
          status: response.status,
          properties_count: mapData.properties?.length || 0,
          districts_count: mapData.districts?.length || 0,
          metroLines_count: mapData.metroLines?.length || 0,
          metroStations_count: mapData.metroStations?.length || 0,
          map_config: {
            enabled: mapData.map_config?.enabled,
            has_key: !!mapData.map_config?.js_api_key,
            has_security_key: !!mapData.map_config?.security_js_key,
            api_key_preview: mapData.map_config?.js_api_key?.substring(0, 10) + '...',
            center: [mapData.map_config?.default_center_lng, mapData.map_config?.default_center_lat],
            zoom: mapData.map_config?.default_zoom
          }
        };
        
        const withCoords = (mapData.properties || []).filter(p => {
          const lat = parseFloat(p.latitude);
          const lng = parseFloat(p.longitude);
          return !isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0;
        });
        
        result.properties_with_coords = withCoords.length;
        result.properties_without_coords = result.properties_count - withCoords.length;
        
        resultEl.textContent = JSON.stringify(result, null, 2);
        statusEl.textContent = '成功';
        statusEl.className = 'status success';
        
        console.log('API数据加载成功:', result);
        
        if (mapData.map_config?.enabled && mapData.map_config?.js_api_key) {
          console.log('✓ 地图配置有效,可以初始化地图');
          document.getElementById('init-map-btn').disabled = false;
        } else {
          console.error('✗ 地图配置无效');
        }
        
      } catch (error) {
        console.error('API请求失败:', error);
        resultEl.textContent = `错误: ${error.message}\n\n${error.stack}`;
        statusEl.textContent = '失败';
        statusEl.className = 'status error';
      }
    }

    function testSDK() {
      const resultEl = document.getElementById('sdk-result');
      const statusEl = document.getElementById('sdk-status');
      
      try {
        const result = {
          AMap_defined: typeof window.AMap !== 'undefined',
          AMap_Map: typeof window.AMap?.Map !== 'undefined',
          AMap_Marker: typeof window.AMap?.Marker !== 'undefined',
          AMap_InfoWindow: typeof window.AMap?.InfoWindow !== 'undefined',
          security_config: JSON.stringify(window._AMapSecurityConfig || {}),
          sdk_script: !!document.getElementById('amap-sdk-script')
        };
        
        resultEl.textContent = JSON.stringify(result, null, 2);
        
        if (window.AMap && window.AMap.Map) {
          statusEl.textContent = '已加载';
          statusEl.className = 'status success';
          console.log('✓ 高德SDK已加载');
        } else {
          statusEl.textContent = '未加载';
          statusEl.className = 'status warning';
          console.warn('高德SDK未加载');
        }
        
      } catch (error) {
        console.error('SDK检查失败:', error);
        resultEl.textContent = `错误: ${error.message}`;
        statusEl.textContent = '检查失败';
        statusEl.className = 'status error';
      }
    }

    async function loadAMapSDK(apiKey, securityKey) {
      if (window.AMap) {
        console.log('高德SDK已存在,无需重新加载');
        return window.AMap;
      }
      
      return new Promise((resolve, reject) => {
        console.log('开始加载高德SDK...');
        console.log('  API Key:', apiKey?.substring(0, 10) + '...');
        console.log('  Security Key:', securityKey?.substring(0, 10) + '...');
        
        if (securityKey) {
          window._AMapSecurityConfig = { securityJsCode: securityKey };
          console.log('✓ Security配置已设置');
        }
        
        const script = document.createElement('script');
        script.id = 'amap-sdk-script';
        script.src = `https://webapi.amap.com/maps?v=1.4.15&lang=en&key=${encodeURIComponent(apiKey)}&plugin=AMap.InfoWindow`;
        script.async = true;
        
        script.onload = () => {
          console.log('✓ 高德SDK加载成功');
          document.getElementById('sdk-status').textContent = '已加载';
          document.getElementById('sdk-status').className = 'status success';
          resolve(window.AMap);
        };
        
        script.onerror = (error) => {
          console.error('✗ 高德SDK加载失败:', error);
          document.getElementById('sdk-status').textContent = '加载失败';
          document.getElementById('sdk-status').className = 'status error';
          reject(new Error('Failed to load AMap SDK'));
        };
        
        document.head.appendChild(script);
        console.log('✓ SDK脚本已添加到页面');
      });
    }

    async function initMap() {
      const resultEl = document.getElementById('map-result');
      const statusEl = document.getElementById('map-status');
      
      try {
        if (!mapData) {
          throw new Error('请先点击"测试API"加载数据');
        }
        
        if (!mapData.map_config || !mapData.map_config.enabled || !mapData.map_config.js_api_key) {
          throw new Error('地图配置无效或未启用');
        }
        
        statusEl.textContent = '加载SDK...';
        statusEl.className = 'status warning';
        resultEl.textContent = '正在加载高德SDK...';
        
        const AMap = await loadAMapSDK(mapData.map_config.js_api_key, mapData.map_config.security_js_key);
        
        statusEl.textContent = '初始化中...';
        resultEl.textContent = '正在初始化地图实例...';
        
        const container = document.getElementById('amap-container');
        if (!container) {
          throw new Error('地图容器未找到');
        }
        
        console.log('地图容器尺寸:', container.offsetWidth, 'x', container.offsetHeight);
        
        mapInstance = new AMap.Map(container, {
          center: [mapData.map_config.default_center_lng || 121.4737, mapData.map_config.default_center_lat || 31.2304],
          zoom: mapData.map_config.default_zoom || 12,
          resizeEnable: true,
          lang: 'en'
        });
        
        console.log('✓ 地图实例创建成功');
        
        mapInstance.on('complete', () => {
          console.log('✓ 地图瓦片加载完成 (complete事件)');
        });
        
        // 添加标记
        const validProps = (mapData.properties || []).filter(p => {
          const lat = parseFloat(p.latitude);
          const lng = parseFloat(p.longitude);
          return !isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0;
        });
        
        console.log('开始渲染', validProps.length, '个标记...');
        
        const markers = [];
        for (let i = 0; i < Math.min(validProps.length, 50); i++) {
          const p = validProps[i];
          const marker = new AMap.Marker({
            position: [parseFloat(p.longitude), parseFloat(p.latitude)],
            content: `<div style="background:#667eea;color:white;padding:4px 10px;border-radius:14px;font-size:11px;font-weight:600;">${p.community || 'Property'}</div>`,
            offset: new AMap.Pixel(-50, -16)
          });
          markers.push(marker);
        }
        
        mapInstance.add(markers);
        console.log('✓ 已添加', markers.length, '个标记');
        
        if (markers.length > 0) {
          mapInstance.setFitView(markers, false, [60, 60, 60, 60]);
          console.log('✓ 地图已自动缩放以显示所有标记');
        }
        
        const result = {
          status: 'success',
          markers_added: markers.length,
          total_properties: validProps.length,
          map_center: mapInstance.getCenter(),
          map_zoom: mapInstance.getZoom()
        };
        
        resultEl.textContent = JSON.stringify(result, null, 2);
        statusEl.textContent = '成功';
        statusEl.className = 'status success';
        
        console.log('✓ 地图初始化完成:', result);
        
      } catch (error) {
        console.error('✗ 地图初始化失败:', error);
        resultEl.textContent = `错误: ${error.message}\n\n${error.stack}`;
        statusEl.textContent = '失败';
        statusEl.className = 'status error';
      }
    }

    // 页面加载完成后自动检查
    window.addEventListener('load', () => {
      console.log('页面加载完成,开始诊断...');
      console.log('User Agent:', navigator.userAgent);
      console.log('Screen:', window.screen.width, 'x', window.screen.height);
      console.log('Window:', window.innerWidth, 'x', window.innerHeight);
      testSDK();
    });
  </script>
</body>
</html>
